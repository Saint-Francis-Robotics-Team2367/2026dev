name: ci

# Run tests, lint, and type checking on every PR and on main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  black:
    name: black --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Check formatting
        run: ./.venv/bin/python -m black --check --diff .

  pyright:
    name: pyright (standard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Type check
        run: ./.venv/bin/python -m pyright

  test:
    name: robotpy test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Run tests
        run: ./.venv/bin/python -m robotpy test
