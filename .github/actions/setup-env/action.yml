name: Setup Python environment
description: Create venv and install dependencies from requirements.txt

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Create venv and install dependencies
      shell: bash
      run: |
        uv run pip install -r requirements.txt
        uv run robotpy sync
