name: Setup Python environment
description: Create venv and install dependencies from requirements.txt

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v2

    - name: Create venv and install dependencies
      shell: bash
      run: |
        uname -a
        uv venv .venv
        uv pip install -r requirements.txt
        ./.venv/bin/python -m robotpy sync
