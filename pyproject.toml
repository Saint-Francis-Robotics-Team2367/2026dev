#
# Use this configuration file to control what RobotPy packages are installed
# on your SystemCore
#

[tool.robotpy]

# Version of robotpy this project depends on
robotpy_version = "2027.0.0a6.post1"

# Which optional robotpy components should be installed?
# -> equivalent to `pip install robotpy[extra1, ...]
components = [
    #"all",
    # "apriltag",
    "commands2",
    # "romi",
    # "sim",
    # "xrp",
]

# Other pip packages to install, such as vendor packages (each element
# is equivalent to a line in requirements.txt).
# Phoenix6 / REVLib SystemCore vendordeps go here once they ship for 2027.
requires = []


# --- Formatting (WPILib/RobotPy standard: Black) ---
[tool.black]
target-version = ["py314"]
# Keep in sync with the version pinned in .github/workflows/lint.yml


# --- Static type checking (pyright; RobotPy's preferred checker) ---
# No `include` on purpose: pyright checks every .py under the repo root, so new
# subsystems/, commands/, and tests/ dirs are covered automatically. RobotPy
# ships py.typed markers + stubs, so wpilib/wpimath/commands2 are fully checked.
[tool.pyright]
# robot_test.py is generated by `robotpy add-tests` and intentionally does a
# wildcard import of the builtin test suite — not our code to lint.
exclude = [".venv", "**/__pycache__", "**/.pytest_cache", "**/robot_test.py"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
# Resolve wpilib/commands2/etc. from the project venv (local + CI both use .venv)
venvPath = "."
venv = ".venv"

